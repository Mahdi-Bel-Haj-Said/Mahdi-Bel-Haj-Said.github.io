<!doctype html>

<body>
<div id="app"></div>
<noscript><p style="font-family:system-ui,sans-serif;padding:24px">This site needs JavaScript. You can still reach Mahdi at <a href="mailto:mahdi.haj.said@gmail.com">mahdi.haj.said@gmail.com</a> or download the <a href="assets/docs/Mahdi-Bel-Haj-Said-Resume-EN.pdf">CV (EN)</a> / <a href="assets/docs/Mahdi-Bel-Haj-Said-CV-FR.pdf">CV (FR)</a>.</p></noscript>
<template id="site-template">
<div class="site {{siteCls}}" id="top" style="{{rootVars}} background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; font-size: 17px; line-height: 1.65; min-height: 100vh">
<a class="skip" href="#about">{{t.skip}}</a>

<header style="position: sticky; top: 0; z-index: 20; background: var(--nav); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--border)">
<nav aria-label="Main" style="max-width: 1160px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px">
<a href="#top" aria-label="Mahdi Bel Haj Said, back to top" style="display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px">
<span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 14px">MB</span>
<span>Mahdi Bel Haj Said</span>
</a>
<div class="navlinks">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="7">
<a class="navlink {{n.active}}" href="{{n.href}}" aria-current="{{n.current}}">{{n.label}}</a>
</sc-for>
</div>
<div class="navctl" style="display: flex; align-items: center; gap: 8px">
<div role="group" aria-label="{{t.langLabel}}" style="display: flex; border: 1px solid var(--border); border-radius: 999px; padding: 3px">
<button type="button" onClick="{{setEn}}" aria-pressed="{{isEn}}" style="{{enStyle}} border: 0; border-radius: 999px; padding: 6px 12px; min-height: 36px; font: 600 13px 'Inter', sans-serif; cursor: pointer">EN</button>
<button type="button" onClick="{{setFr}}" aria-pressed="{{isFr}}" style="{{frStyle}} border: 0; border-radius: 999px; padding: 6px 12px; min-height: 36px; font: 600 13px 'Inter', sans-serif; cursor: pointer">FR</button>
</div>
<button type="button" onClick="{{toggleTheme}}" aria-label="{{t.themeLabel}}" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--text); display: grid; place-items: center; cursor: pointer">
<sc-if value="{{isDark}}" hint-placeholder-val="{{ true }}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
</sc-if>
<sc-if value="{{isLight}}" hint-placeholder-val="{{ false }}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
</sc-if>
</button>
<button type="button" class="termbtn {{termBtnCls}}" ref="{{termBtnRef}}" onClick="{{toggleTerm}}" aria-label="{{tt.btnLabel}}" aria-expanded="{{termOpen}}" title="{{tt.btnLabel}}" style="position: relative; width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--accent-line); background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; cursor: pointer; font: 700 14px 'JetBrains Mono', ui-monospace, monospace">&gt;<span class="tcur" aria-hidden="true">_</span></button>
</div>
</nav>
<div class="progress" aria-hidden="true"></div>

<main>
<!-- HERO -->

<div class="hero-glow" aria-hidden="true"></div>

<div class="enter d5" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 12px">

</a>

<a class="btn" href="https://www.linkedin.com/in/mahdi-bel-haj-said-152602202/" aria-label="LinkedIn" style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--border); display: grid; place-items: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
</a>
<a class="btn" href="https://github.com/Mahdi-Bel-Haj-Said" aria-label="GitHub" style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--border); display: grid; place-items: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.9a3.4 3.4 0 0 0-.9-2.6c3.1-.4 6.4-1.5 6.4-6.9A5.4 5.4 0 0 0 20 4.8 5 5 0 0 0 19.9 1S18.7.7 16 2.5a13.4 13.4 0 0 0-7 0C6.3.7 5.1 1 5.1 1A5 5 0 0 0 5 4.8a5.4 5.4 0 0 0-1.5 3.8c0 5.4 3.3 6.5 6.4 6.9a3.4 3.4 0 0 0-.9 2.6V22"></path></svg>
</a>
</div>
</div>
<div class="enter d6" style="flex: 1 1 260px; display: flex; justify-content: center">
<div style="position: relative; width: 280px; height: 280px">
<div class="ring" aria-hidden="true"></div>

<span class="bob" aria-hidden="true" style="position: absolute; top: 4px; right: -34px; display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--accent-line); color: var(--text); font: 600 13px 'Inter', sans-serif; box-shadow: 0 10px 28px -14px var(--accent); white-space: nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent)"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>LLM agents</span>

</div>
</div>
</div>
<a class="cue" href="#about" aria-label="{{t.scrollCue}}"><span class="cue-mouse" aria-hidden="true"><span class="cue-dot"></span></span></a>
</section>

<div class="marquee-wrap" aria-hidden="true" style="overflow: hidden; border-bottom: 1px solid var(--border); padding: 20px 0; background: var(--surface)">
<div class="marquee" style="display: flex; gap: 44px; width: max-content">
<sc-for list="{{marquee}}" as="m" hint-placeholder-count="16">
<span style="display: flex; align-items: center; gap: 12px; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 500; color: var(--muted); white-space: nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" style="color: var(--accent)"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path></svg>{{m}}</span>
</sc-for>
</div>
</div>

<!-- STATS -->
<section aria-label="{{t.statsLabel}}" style="max-width: 1160px; margin: 0 auto; padding: 72px 24px 0">
<div ref="{{statsRef}}" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 165px), 1fr)); gap: 12px">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="6">
<div class="stat" style="padding: 24px 20px; border: 1px solid var(--border); border-radius: 18px; background: var(--surface); display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 38px; font-weight: 700; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap">{{s.value}}</p>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: var(--muted)">{{s.label}}</p>
</div>
</sc-for>
</div>
</section>

</div>

<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 3px; color: var(--accent)"><path d="M20 6 9 17l-5-5"></path></svg>
<span>{{f}}</span>
</li>
</sc-for>
</ul>
</div>
</section>

<!-- MANIFESTO -->
<section aria-label="{{t.manifestoLabel}}" onMouseMove="{{manMove}}" onMouseLeave="{{manLeave}}" style="position: relative; max-width: 1160px; margin: 0 auto; padding: 128px 24px 24px">
<canvas class="net" ref="{{netManRef}}" aria-hidden="true"></canvas>

<p style="position: relative; margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: clamp(30px, 4.8vw, 62px); line-height: 1.15; letter-spacing: -0.025em">
<sc-for list="{{manifesto}}" as="w" hint-placeholder-count="18"><span class="{{w.cls}}">{{w.w}}</span></sc-for>

</section>
